# This file states properties used by jsmtlib.
#
# jSMTLIB looks for a file named jsmtlib.properties in four places, loading
# each one found on top of the last -- so later sources override earlier
# ones for any key both define, and the last one loaded wins overall:
#   1. As a classpath resource (e.g. bundled inside jSMTLIB.jar itself)
#   2. In the directory containing jSMTLIB.jar, if running from a jar
#   3. In the user's home directory
#   4. In the current working directory  <- highest precedence
# In practice this means a jsmtlib.properties file in your working directory
# overrides everything else, which is the usual way to customize a checkout.

# The directory in which logic and theory definitions are found
# (if not set, the files from the official distribution as distributed in
#  the .jar file are used - there should be only a rare need to set this)
# This value can also be set on the command-line by the --logics option.
org.smtlib.logic_path=

# Solvers are identified by name (here 'ZZZ').
# There is a solver 'test' that does type-checking but no actual solving.
# Otherwise a ZZZ solver must be associated with an 'adapter' and an executable.

# The default solver to use. This can be overridden on the command-line with
# the --solver option. If not set the default is to type-check only.
##org.smtlib.default-solver= 

# The adapter class to use for the solver. If not specified, then solver ZZZ
# will use class org.smtlib.solvers.Solver_ZZZ (with any '-' or '.' in ZZZ
# replaced by '_'), and if that class does not exist, the solver falls back
# to the generic SMT-LIB-text adapter, org.smtlib.solvers.Solver_smt.
# (Replace ZZZ with the solver name)
##org.smtlib.solver_ZZZ.adapter=

# The capabilities a solver supports, as a comma-separated list, queried by
# org.smtlib.SolverCapabilities: a name records a supported capability, a
# -name an unsupported one, and an unmentioned one is unknown. The names are
# strings, floating-point, datatypes and proofs. A capability a solver's entry
# does not mention is taken from its family's entry (the name before the first
# -<digit>: z3-4.12.6 uses z3), so a version's entry need record only how that
# version differs from the family.
# The entries below are based on these solvers' test goldens.
##org.smtlib.solver_ZZZ.capabilities=strings,-floating-point,datatypes,-proofs

# A solver must have either an executable or a whole command-line specified.
# The .exec value is overridden by any value specified on the command-line
# (--exec option). An absolute path is used as is; a relative path with a
# directory part is relative to the current directory; a simple file name is
# looked for in the SMT_SOLVER_DIR directory, then on the PATH. These are the
# solver versions actually installed and tested against in this checkout;
# override them in a jsmtlib.properties file in your working directory to
# point at different versions or locations.
# yices2-2.7.0 is the default; Windows only ships yices2-2.6.5 (no 2.7.0 build),
# hence the platform-specific override -- see SMT.platformName().
org.smtlib.solver_yices2.exec=yices2-2.7.0
org.smtlib.solver_yices2.exec.windows=yices2-2.6.5
# 2.6.5 needs its own adapter (see Solver_yices2_2_6), on Windows also under the bare name
org.smtlib.solver_yices2.adapter.windows=org.smtlib.solvers.Solver_yices2_2_6
org.smtlib.solver_yices2-2.6.5.adapter=org.smtlib.solvers.Solver_yices2_2_6
org.smtlib.solver_yices2-2.6.5.exec=yices2-2.6.5
org.smtlib.solver_yices2-2.7.0.adapter=org.smtlib.solvers.Solver_yices2
org.smtlib.solver_yices2-2.7.0.exec=yices2-2.7.0
org.smtlib.solver_yices2.capabilities=-strings,-floating-point,-datatypes,-proofs

# No Solver_z3 class exists (the generic naming convention has nothing to
# fall back to for the bare "z3" name), so this needs an explicit adapter,
# unlike the bare yices2 entry above and the cvc5 entry below, whose
# naming-convention classes (Solver_yices2, Solver_cvc5) already exist.
org.smtlib.solver_z3.adapter=org.smtlib.solvers.Solver_z3_recent
org.smtlib.solver_z3.exec=z3-4.16.0
org.smtlib.solver_z3.capabilities=strings,floating-point,datatypes,proofs

org.smtlib.solver_z3-4.3.exec=z3-4.3.1
# Windows ships z3-4.3.2 (not .1) under this same solver name -- see SMT.platformName().
# The .2 build also has its own push-command bug (see Solver_z3_4_3_2), hence the
# matching platform-specific adapter override, not just a different executable.
org.smtlib.solver_z3-4.3.exec.windows=z3-4.3.2
org.smtlib.solver_z3-4.3.adapter.windows=org.smtlib.solvers.Solver_z3_4_3_2
# z3 4.3 predates strings and floating point, and its datatypes use pre-2.6 syntax
org.smtlib.solver_z3-4.3.capabilities=-strings,-floating-point,-datatypes,proofs
# z3 before 4.8 has only the pre-2.6 string function names (str.to.re, no
# str.<); before 4.7 it has no declare-datatype (4.6.0 hangs on it). These
# versions are not configured above, but are used by name, with Solver_z3_recent.
org.smtlib.solver_z3-4.5.0.capabilities=-strings,-datatypes
org.smtlib.solver_z3-4.5.0.adapter=org.smtlib.solvers.Solver_z3_4_5
org.smtlib.solver_z3-4.6.0.capabilities=-strings,-datatypes
org.smtlib.solver_z3-4.7.1.capabilities=-strings
org.smtlib.solver_z3-4.8.12.adapter=org.smtlib.solvers.Solver_z3_recent
org.smtlib.solver_z3-4.8.12.exec=z3-4.8.12
org.smtlib.solver_z3-4.10.2.adapter=org.smtlib.solvers.Solver_z3_recent
org.smtlib.solver_z3-4.10.2.exec=z3-4.10.2
org.smtlib.solver_z3-4.12.6.adapter=org.smtlib.solvers.Solver_z3_recent
org.smtlib.solver_z3-4.12.6.exec=z3-4.12.6
org.smtlib.solver_z3-4.14.1.adapter=org.smtlib.solvers.Solver_z3_recent
org.smtlib.solver_z3-4.14.1.exec=z3-4.14.1
org.smtlib.solver_z3-4.16.0.adapter=org.smtlib.solvers.Solver_z3_recent
org.smtlib.solver_z3-4.16.0.exec=z3-4.16.0

org.smtlib.solver_cvc5.exec=cvc5-1.3.2
org.smtlib.solver_cvc5-1.3.2.adapter=org.smtlib.solvers.Solver_cvc5
org.smtlib.solver_cvc5-1.3.2.exec=cvc5-1.3.2
org.smtlib.solver_cvc5.capabilities=strings,floating-point,datatypes,proofs

# smtinterpol is a Java SMT solver, launched as 'java -jar <jar> -q' rather than
# as a native executable -- .command spells out that whole command line, with
# %exec% marking where the resolved 'exec' jar path (SMT_SOLVER_DIR-relative)
# gets substituted in, since it isn't argv[0] here.
org.smtlib.solver_smtinterpol-2.5.adapter=org.smtlib.solvers.Solver_smtinterpol
org.smtlib.solver_smtinterpol-2.5.exec=smtinterpol-2.5.jar
org.smtlib.solver_smtinterpol-2.5.command=java,-jar,%exec%,-q
org.smtlib.solver_smtinterpol.capabilities=-strings,-floating-point,datatypes,proofs

# Bitwuzla (bit-vectors/FP/arrays/UF only -- no arithmetic, no datatypes) has real
# protocol gaps (no get-info/get-option/get-assignment/get-proof, and it exits after
# essentially any error, not just protocol violations) that Solver_bitwuzla works
# around; see that class's javadoc. No macOS-Intel build exists (only linux,
# macos-arm64, windows), so it's simply absent and skipped there like any solver
# missing on a given platform/arch.
org.smtlib.solver_bitwuzla.exec=bitwuzla-0.9.1
org.smtlib.solver_bitwuzla.capabilities=-strings,floating-point,-datatypes,-proofs

# Alt-Ergo -- see Solver_altergo's javadoc: this is a first-pass, CI-unverified
# adapter (no local binary was available to test against -- no macOS-Intel build
# in the Solvers repo, no Homebrew formula). No macOS-Intel build means it's
# skipped there like any solver missing on a given platform/arch; Windows also has
# no build at all currently.
org.smtlib.solver_altergo.exec=alt-ergo-2.6.3
# From alt-ergo 2.6.3 itself (Linux): it rejects the String and FloatingPoint sorts
# (its fpa theory is its own rounding operators, not SMT-LIB's), accepts datatypes,
# and ignores get-proof.
org.smtlib.solver_altergo.capabilities=-strings,-floating-point,datatypes,-proofs

# Simplify is a legacy, non-SMT-LIB-native prover (own s-expression-ish protocol,
# translated by Solver_simplify) -- no bit-vectors, no models. The Linux and
# Windows builds are 32-bit but still runnable there; deliberately NOT setting
# .exec.macos to the macOS build (Simplify-1.5.5) -- it's a 32-bit i386/PPC
# Mach-O binary, which no current macOS (10.15+ dropped 32-bit support
# entirely) can execute at all, Apple Silicon or Intel. Leaving no macOS
# override means the bare .exec (a Linux-only filename) resolves to nothing
# on macOS, so it's cleanly skipped by the up-front executable-presence
# filter there instead of crashing every test with a launch failure.
org.smtlib.solver_simplify.exec=Simplify-1.5.4
org.smtlib.solver_simplify.capabilities=-strings,-floating-point,-datatypes,-proofs

# Not a real solver -- exists solely so SMTTests/scripts/batch-smt4.scr can test
# jSMTLIB's own error handling when a solver's jsmtlib.properties .exec entry
# resolves to a file that isn't there, launched with no --exec CLI override (a
# distinct code path from SMTCommandLineTests#solverNoExecutable, which covers a
# solver name with NO properties entry at all, falling back to the bare name as
# the executable). batch-smt4.scr used to name "simplify" here instead, back when
# no real Simplify binary was wired in and any invocation of it necessarily failed
# to launch on every platform; now that simplify is a genuine, working solver on
# some platforms (see above), that script needs its own always-missing target
# instead so its result stays platform-independent. This filename must never be
# created anywhere a solver executable could be found.
org.smtlib.solver_missingexec.exec=jSMTLIB-nonexistent-test-executable

# A command (executable + arguments) is specified by a comma-separated list
# of executable path and arguments, with no extraneous spaces, in the form
##org.smtlib.solver_ZZZ.command=EXE,arg1,arg2
# If 'exec' is also set, %exec% in the command list is replaced by the resolved
# executable path -- use this when the executable isn't the first word of the
# command (e.g. a Java-launched jar); with no %exec% placeholder present, the
# resolved executable simply replaces the first word (argv[0]), as before.