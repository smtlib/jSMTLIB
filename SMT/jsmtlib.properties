# matching platform-specific adapter override, not just a different executable.
org.smtlib.solver_z3-4.3.exec.windows=z3-4.3.2
org.smtlib.solver_z3-4.3.adapter.windows=org.smtlib.solvers.Solver_z3_4_3_2
org.smtlib.solver_z3_4_5.exec=
org.smtlib.solver_z3_4_6.adapter=org.smtlib.solvers.Solver_z3_4_5
org.smtlib.solver_z3_4_6.exec=
org.smtlib.solver_z3_4_6.command=
org.smtlib.solver_z3_4_8.adapter=org.smtlib.solvers.Solver_z3_4_8
org.smtlib.solver_z3_4_8.exec=
org.smtlib.solver_z3_4_8.command=
