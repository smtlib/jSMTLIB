name: Debug #133 (bitwuzla get-unsat-assumptions)

## Temporary diagnostic workflow for issue #133; delete before merging the branch.
## Runs only bitwuzla, on the platforms that ship it, against the getUnsatCore tests,
## with bitwuzla's own native behavior and jSMTLIB's verbose trace side by side.

on:
  workflow_dispatch:
  push:
    branches: [ fix/bitwuzla-unsat-assumptions ]

jobs:
  debug:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
          - os: ubuntu-24.04
            label: ubuntu
          - os: ubuntu-24.04-arm
            label: ubuntu-arm64
          - os: windows-2022
            label: windows
      fail-fast: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        sparse-checkout: ./.github
        path: ACTIONS

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: OS setup
      uses: ./ACTIONS/.github/actions/os-setup/

    - name: Checkout jSMTLIB
      uses: ./ACTIONS/.github/actions/jsmtlib-checkout/
      with:
        branch: ${{ github.ref_name }}

    - name: Build jSMTLIB
      uses: ./ACTIONS/.github/actions/jsmtlib-build/

    - name: Determine Solvers subdirectory
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          macOS-ARM64)  SOLVERS_SUBDIR=Solvers-macos-arm64 ;;
          Linux-ARM64)  SOLVERS_SUBDIR=Solvers-linux-arm64 ;;
          Linux-X64)    SOLVERS_SUBDIR=Solvers-linux ;;
          Windows-X64)  SOLVERS_SUBDIR=Solvers-windows ;;
          *) echo "ERROR: unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac
        echo "SOLVERS_SUBDIR=$SOLVERS_SUBDIR" >> "$GITHUB_ENV"

    - name: Download Solvers for this platform
      id: solvers
      uses: smtlib/Solvers/.github/actions/download-solvers@download-solvers-v1
      with:
        subdir: ${{ env.SOLVERS_SUBDIR }}

    - name: Locate bitwuzla
      shell: bash
      run: |
        SOLVER_DIR="${{ steps.solvers.outputs.dir }}"
        SOLVER_DIR="${SOLVER_DIR//\\/\/}"
        echo "SMT_SOLVER_DIR=$SOLVER_DIR" >> "$GITHUB_ENV"
        ls -la "$SOLVER_DIR"
        BW=$(ls "$SOLVER_DIR"/bitwuzla* | head -1)
        echo "BW=$BW" >> "$GITHUB_ENV"
        echo "bitwuzla binary: $BW"
        "$BW" --version || echo "bitwuzla --version exited $?"

    ## bitwuzla alone, fed exactly what jSMTLIB sends (its priming line plus the test's
    ## commands), then variants. Each command's response is printed in order, and the
    ## exit code shows whether bitwuzla died.
    - name: Native bitwuzla sessions
      shell: bash
      run: |
        set +e
        T=jSMTLIB/SMTTests/tests/getUnsatCore/err_getUnsatAssumptionsAfterPlainCheckSat.tst
        session() {
          echo "=================== $1"
          printf '%s\n' "${@:2}" | sed 's/^/IN : /'
          echo "-------------------"
          printf '%s\n' "${@:2}" | "$BW" --lang smt2 2>&1 | sed 's/^/OUT: /'
          echo "exit=${PIPESTATUS[1]}"
        }
        CMDS=()
        while IFS= read -r line; do CMDS+=("$line"); done < <(grep -v '^;' "$T" | tr -d '\r' | grep -v '^$')
        session "A: the test as jSMTLIB sends it" "(set-option :print-success true)" "${CMDS[@]}"
        session "B: get-option before get-unsat-assumptions" "(set-option :print-success true)" "${CMDS[@]:0:5}" \
          "(get-option :produce-unsat-assumptions)" "(get-unsat-assumptions)"
        session "C: option set before set-logic" "(set-option :print-success true)" \
          "(set-option :produce-unsat-assumptions true)" "(set-logic QF_UF)" "(assert false)" "(check-sat)" "(get-unsat-assumptions)"
        session "D: check-sat-assuming" "(set-option :print-success true)" \
          "(set-option :produce-unsat-assumptions true)" "(set-logic QF_UF)" "(declare-const p Bool)" \
          "(check-sat-assuming (p (not p)))" "(get-unsat-assumptions)"
        session "E: get-unsat-assumptions without the option" "(set-option :print-success true)" \
          "(set-logic QF_UF)" "(assert false)" "(check-sat)" "(get-unsat-assumptions)"
        exit 0

    ## jSMTLIB on the target test with its most verbose trace. Off Windows, a wrapper
    ## around bitwuzla also records the exact bytes exchanged with the process.
    - name: jSMTLIB on the target test (verbose)
      shell: bash
      run: |
        set +e
        T=jSMTLIB/SMTTests/tests/getUnsatCore/err_getUnsatAssumptionsAfterPlainCheckSat.tst
        echo "=================== plain run: stdout"
        java -jar jSMTLIB/SMT/jSMTLIB.jar -s bitwuzla "$T" 2> plain.err
        echo "exit=$?"
        echo "=================== plain run: stderr"
        cat plain.err
        echo "=================== verbose run (--verbose 3 --echo --diag stdout)"
        java -jar jSMTLIB/SMT/jSMTLIB.jar -s bitwuzla --verbose 3 --echo --diag stdout "$T" 2>&1
        echo "exit=$?"
        if [[ "${{ runner.os }}" != "Windows" ]]; then
          W="$PWD/bwtee"
          cat > "$W" <<EOF
        #!/bin/bash
        tee -a "$PWD/bw.in" | "$BW" "\$@" 2>&1 | tee -a "$PWD/bw.out"
        EOF
          chmod +x "$W"
          rm -f bw.in bw.out
          echo "=================== wrapped run"
          java -jar jSMTLIB/SMT/jSMTLIB.jar -s bitwuzla -e "$W" "$T" 2>&1
          echo "exit=$?"
          echo "=================== bytes sent to bitwuzla"
          cat -vet bw.in
          echo "=================== bytes bitwuzla returned"
          cat -vet bw.out
        fi
        exit 0

    ## The harness on every getUnsatCore test (the skip for the target is removed on this
    ## branch), printing each mismatch's actual output.
    - name: Harness on getUnsatCore tests
      shell: bash
      run: |
        set +e
        cd jSMTLIB/SMTTests
        source ./setup
        fails=0
        for t in tests/getUnsatCore/*.tst; do
          bash ./runtest bitwuzla "$t"; st=$?
          if [ $st -ne 0 ] && [ $st -ne 77 ]; then
            fails=$((fails+1))
            for f in "$t".out.bitwuzla.actual "$t".err.bitwuzla.actual; do
              [ -e "$f" ] && { echo "----- $f"; cat "$f"; }
            done
          fi
        done
        echo "failures: $fails"
        exit $fails
