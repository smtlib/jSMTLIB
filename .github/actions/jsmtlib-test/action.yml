name: 'jSMTLIB Test'
description: 'A composite action that runs the jSMTLIB test suite on an existing build'

## Presumes jSMTLIB/ exists in the current working directory (from jsmtlib-checkout),
## and that jSMTLIB/SMT/jSMTLIB.jar has been placed there (by the test job).
##
## Clones the Solvers repo, selects the platform-appropriate subdirectory, and exports
## SMT_SOLVER_DIR so that the Java resolver prepends it to relative executable names
## from SMT/jsmtlib.properties.  No generated jsmtlib.properties file is written.

inputs:
  solvers:
    description: 'Override SMT_TEST_SOLVERS (space-separated). Blank = the Makefile default (full solver list).'
    required: false
    default: ''
  label:
    description: 'Human-readable identifier for this platform leg (e.g. "macos-arm64"), used to keep failure-artifact names unique across the test matrix. Falls back to runner.os-runner.arch if blank.'
    required: false
    default: ''
  coverage:
    description: >-
      Set to 'true' to run the suite with JaCoCo instrumentation and upload a
      per-leg coverage artifact. Default 'false': all local coverage testing so
      far has only ever run on macOS, and turning this on for every matrix leg
      (CI run 35531790532) showed macos-15-x86_64 specifically taking over 35
      minutes under instrumentation (every other leg: 9-21 minutes) -- root
      cause not yet pinned down (see issue #98). Off by default until
      that's understood, but every other piece (cov-clean/cov-test/cov-report,
      the per-leg artifact upload, the Windows -javaagent path fix) is already
      in place and working on every leg except that one, so flipping this back
      to 'true' is a one-line change whenever it's worth revisiting.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    ## Computed before cloning so the clone below can be scoped to just this one
    ## subdirectory instead of pulling every platform's binaries.
    - name: Determine Solvers subdirectory
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          macOS-ARM64)  SOLVERS_SUBDIR=Solvers-macos-arm64 ;;
          macOS-X64)    SOLVERS_SUBDIR=Solvers-macos ;;
          Linux-ARM64)  SOLVERS_SUBDIR=Solvers-linux-arm64 ;;
          Linux-X64)    SOLVERS_SUBDIR=Solvers-linux ;;
          Windows-X64)  SOLVERS_SUBDIR=Solvers-windows ;;
          *) echo "ERROR: unsupported runner OS/arch: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac
        echo "SOLVERS_SUBDIR=$SOLVERS_SUBDIR" >> "$GITHUB_ENV"

    ## Delegates the actual clone to smtlib/Solvers' own shared action (moved there from
    ## OpenJML/Solvers -- same repo, same history, GitHub redirects the old owner/name) -- the same
    ## blobless (--filter=blob:none), sparse, shallow clone this step used to do inline,
    ## scoped to just this platform's subdirectory so each of the 5 matrix legs pulls
    ## only its own solver binaries instead of every platform's worth every time. Pinned
    ## to the download-solvers-v1 tag, not a branch, so a future change in that repo can't
    ## silently alter this workflow's behavior underneath it.
    - name: Download Solvers for this platform
      id: solvers
      uses: smtlib/Solvers/.github/actions/download-solvers@download-solvers-v1
      with:
        subdir: ${{ env.SOLVERS_SUBDIR }}

    - name: Configure solver paths for CI
      shell: bash
      run: |
        SOLVER_DIR="${{ steps.solvers.outputs.dir }}"
        ## Normalize to forward slashes so Java path handling works on Windows.
        SOLVER_DIR="${SOLVER_DIR//\\/\/}"

        ## Windows ships z3-4.3.2.exe; jsmtlib.properties references z3-4.3.1.
        ## Create z3-4.3.1.exe alongside it so the relative name resolves correctly.
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          if [[ -f "$SOLVER_DIR/z3-4.3.2.exe" && ! -f "$SOLVER_DIR/z3-4.3.1.exe" ]]; then
            cp "$SOLVER_DIR/z3-4.3.2.exe" "$SOLVER_DIR/z3-4.3.1.exe"
          fi
        fi

        ## Export SMT_SOLVER_DIR so the Java resolver prepends it to relative exec names
        ## from jsmtlib.properties (e.g. z3-4.3.1 → $SMT_SOLVER_DIR/z3-4.3.1).
        echo "SMT_SOLVER_DIR=$SOLVER_DIR" >> "$GITHUB_ENV"

    ## Not wired into jsmtlib.properties yet (cvc5/z3 adapter work is happening
    ## separately, yices2/bitwuzla/alt-ergo/smtinterpol after that) — this just confirms
    ## every solver binary present for this platform actually executes on this runner
    ## (e.g. that macOS's freshly-built libcudd and brew-installed gmp/mpfr resolve),
    ## before sinking time into the full test suite below. Iterates every file in
    ## SMT_SOLVER_DIR rather than a per-solver-name list, which would go stale as
    ## solvers are added; Solvers-windows is the one directory with non-solver files
    ## (Z3's .dll/.lib/.xml JNI bindings and runtime redistributables) alongside the
    ## .exe's, so those extensions are skipped. A solver failing to run here is a
    ## warning, not a build failure — this step always exits 0.
    - name: Smoke test solver binaries
      shell: bash
      run: |
        ## GitHub Actions runs bash steps with `set -e` by default. A bare
        ## `out=$(cmd)` assignment (not inside if/&&/||) trips errexit the moment
        ## any solver's --version exits nonzero, aborting this whole step *and*
        ## skipping "Run jSMTLIB tests" (composite actions stop at the first
        ## failing sub-step) - silently skipping the real suite entirely. `set +e`
        ## makes that structurally impossible regardless of exact command syntax.
        set +e
        echo "Solver smoke test on ${{ runner.os }}-${{ runner.arch }}"
        for exe in "$SMT_SOLVER_DIR"/*; do
          [ -f "$exe" ] || continue
          name=$(basename "$exe")
          case "$name" in
            *.dll|*.lib|*.xml) continue ;;
            *.jar)
              out=$(java -jar "$exe" -version 2>&1); ok=$?
              ;;
            *)
              out=$("$exe" --version 2>&1); ok=$?
              ## Some older solvers (e.g. z3 4.3.x) predate the --version convention.
              if [ $ok -ne 0 ]; then
                out=$("$exe" -version 2>&1); ok=$?
              fi
              ;;
          esac
          if [ $ok -eq 0 ]; then
            echo "OK   $name: $(echo "$out" | head -1)"
          else
            echo "FAIL $name:"
            echo "$out" | sed 's/^/       /'
          fi
        done
        exit 0

    ## Only set SMT_TEST_SOLVERS when an override was actually given -- the Makefile's
    ## `?=` default only kicks in when the variable is entirely unset in the environment,
    ## so exporting it as an empty string here (e.g. from an un-filled workflow_dispatch
    ## input) would leave the suite running against no solvers at all instead of falling
    ## back to the default list.
    - name: Apply solver-list override
      if: inputs.solvers != ''
      shell: bash
      run: echo "SMT_TEST_SOLVERS=${{ inputs.solvers }}" >> "$GITHUB_ENV"

    ## A Linux-only hang used to burn the full 6-hour job timeout here (runs 32097690084,
    ## 32208754026) -- root-caused and fixed: Solver_z3_recent never primed :print-success,
    ## so the first real command to a z3-recent process on Linux got no response at all and
    ## jSMTLIB waited forever, indistinguishable from "just slow" (see Solver_z3_recent.java
    ## and the jsmtlib_ci_cross_platform_verification history for the full writeup). The
    ## job-level timeout-minutes in build.yml remains as a safety net regardless.
    - name: Run jSMTLIB tests
      if: inputs.coverage != 'true'
      shell: bash
      run: |
        make -C jSMTLIB/SMTTests tests

    ## Runs the exact same suite as `make tests` (cov-test's recipe is the identical
    ## `bash ./runjunits` call, just with COV set so the JaCoCo agent instruments both the
    ## main JVM and every spawned solver process -- see SMTTests/Makefile) and then builds
    ## the HTML+XML report from the collected .exec file. The test outcome (not the report
    ## step's) is what this step ultimately exits with, so "Fail job if tests failed" below
    ## keeps working exactly as before regardless of whether coverage reporting itself
    ## succeeds -- errexit is turned off only around the fallible test run so its exit code
    ## can be captured before continuing, matching the "Smoke test solver binaries" step's
    ## own reasoning above for why a bare $(...) assignment can't be left under `set -e`.
    - name: Run jSMTLIB tests (with coverage)
      if: inputs.coverage == 'true'
      shell: bash
      run: |
        make -C jSMTLIB/SMTTests cov-clean
        set +e
        make -C jSMTLIB/SMTTests cov-test
        TEST_EXIT=$?
        set -e
        # Per-leg HTML/XML isn't generally needed -- only the combined report built from
        # all 5 legs' merged junits.exec (`make ci-cov`, see SMTTests/Makefile) is. Left
        # commented rather than removed: the raw junits.exec this leg uploads is still
        # enough to regenerate this leg's own HTML/XML by hand if ever wanted (`make -C
        # jSMTLIB/SMTTests cov-report`), and uncommenting this line restores it as a
        # standard part of every coverage run.
        # make -C jSMTLIB/SMTTests cov-report || echo "::warning::Coverage report generation failed (test exit code $TEST_EXIT is unaffected)"
        exit $TEST_EXIT

    ## Captures exactly what's needed to debug a failure after the fact, without needing
    ## to reproduce it locally: the .actual files FileTests.java writes next to a golden
    ## on mismatch (the same expected-vs-actual diff seen in the console log, but as a
    ## standalone file you can pull down and inspect/diff directly) -- both FileTests'
    ## own tests/**/*.actual and ScriptTests'/runscript's equivalent .out.actual/
    ## .err.actual/.cmb.actual under scripts/** (the latter was missing for a long time;
    ## a ScriptTests failure had to be reconstructed from junit-logs text alone until
    ## this was widened) -- and the timestamped junit-logs/*.log that records every
    ## test's PASS/FAIL/RUNNING as it happened, for correlating ordering and timing
    ## across a run. if-no-files-found is set to 'warn' (not 'error') since a failure
    ## can also come from something before any test ran (e.g. a compile error), in
    ## which case there may be nothing to collect here.
    ##
    ## `|| cancelled()`: a job-level timeout-minutes cancellation (build.yml's safety net
    ## for the Linux hang, now fixed but the safety net stays) reports as cancelled, not
    ## failed -- failure() alone was silently skipping this step on exactly the runs most
    ## worth capturing (confirmed: no test-failure-ubuntu* artifact ever appeared on any
    ## of the several timed-out runs during that investigation). Not always(): that would
    ## also fire (and upload junit-logs/*.log, which exists on every run, pass or fail) on
    ## ordinary green runs, which is just noise -- this keeps upload scoped to "something
    ## worth debugging".
    - name: Upload test failure artifacts
      if: failure() || cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: test-failure-${{ inputs.label != '' && inputs.label || format('{0}-{1}', runner.os, runner.arch) }}
        path: |
          jSMTLIB/SMTTests/tests/**/*.actual
          jSMTLIB/SMTTests/scripts/**/*.actual
          jSMTLIB/SMTTests/junit-logs/
        if-no-files-found: warn
        retention-days: 14

    ## Uploaded every run, not just failures (unlike the artifact above) -- coverage data
    ## is useful whether or not the tests it came from all passed. The whole cov/ directory
    ## goes up, not just a percentage -- currently just cov/junits.exec, the raw JaCoCo
    ## execution data, since the "Run jSMTLIB tests (with coverage)" step's cov-report
    ## call (which would also produce cov/html/ and cov/coverage.xml, a full
    ## per-package/per-class/per-line drill-down for this one leg) is commented out there:
    ## only the combined report built from every leg's merged junits.exec is generally
    ## needed, and uncommenting that call restores this leg's own html/xml here too, with
    ## no change needed on this end. bin/ (the compiled
    ## org.smtlib.test/org.smtlib.test.bugs JUnit classes cov-test itself compiled) goes up
    ## alongside it -- cov-report's own --classfiles bin (see SMTTests/Makefile) already
    ## covers this leg's own html/xml, but `make ci-cov`'s client-side merge across every
    ## leg's junits.exec needs its own matching classfiles for those same classes, and (per
    ## issue #122's lesson for the production jar) that has to be classfiles that actually
    ## produced this run's execution data, not a local recompile with no guaranteed
    ## relationship to it. One artifact per matrix leg (matching test-failure-* above) since
    ## each platform's run exercises a different subset of solver-adapter code
    ## (isWindows/isMac branches, per-platform solver availability, etc.) -- a single merged
    ## report would hide that platform-specific signal. if-no-files-found is 'warn', not
    ## 'error', for the same reason as above: a failure before any test ran (e.g. a compile
    ## error) can leave cov/ (and bin/) empty or missing. Gated on inputs.coverage (not just
    ## always()): with coverage off, cov/ never gets created at all, so this would otherwise
    ## just be a guaranteed "no files found" warning on every single run.
    - name: Upload coverage artifact
      if: always() && inputs.coverage == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ inputs.label != '' && inputs.label || format('{0}-{1}', runner.os, runner.arch) }}
        path: |
          jSMTLIB/SMTTests/cov
          jSMTLIB/SMTTests/bin
        if-no-files-found: warn
        retention-days: 14
