name: 'jSMTLIB Test'
description: 'A composite action that runs the jSMTLIB test suite on an existing build'

## Presumes jSMTLIB/ and Solvers/ exist in the current working directory (from jsmtlib-checkout),
## and that jSMTLIB/SMT/jSMTLIB.jar has been built (by jsmtlib-build).
##
## Writes a CI-appropriate jsmtlib.properties to jSMTLIB/SMT/ pointing at the cloned Solvers.
## The test runner (SMTTests/setup) puts SMT/ on the Java classpath, so properties are found there.

runs:
  using: 'composite'
  steps:
    - name: Clone Solvers repo
      shell: bash
      run: git clone -b master --depth 1 https://github.com/OpenJML/Solvers

    - name: Configure solver paths for CI
      shell: bash
      run: |
        case "${{ runner.os }}" in
          macOS)   SOLVERS=$GITHUB_WORKSPACE/Solvers/Solvers-macos ;;
          Linux)   SOLVERS=$GITHUB_WORKSPACE/Solvers/Solvers-linux ;;
          Windows) SOLVERS=$GITHUB_WORKSPACE/Solvers/Solvers-windows ;;
          *) echo "ERROR: unsupported runner OS: ${{ runner.os }}"; exit 1 ;;
        esac
        chmod +x $SOLVERS/z3-* 2>/dev/null || true
        {
          echo "org.smtlib.logic_path="
          echo "org.smtlib.solver_z3.exec=$SOLVERS/z3-4.3.1"
          echo "org.smtlib.solver_z3_4_3.exec=$SOLVERS/z3-4.3.1"
          echo "org.smtlib.solver_z3_4_5.exec=$SOLVERS/z3-4.5.0"
          echo "org.smtlib.solver_z3_4_6.adapter=org.smtlib.solvers.Solver_z3_4_5"
          echo "org.smtlib.solver_z3_4_6.exec=$SOLVERS/z3-4.6.0"
          echo "org.smtlib.solver_z3_4_6.command=$SOLVERS/z3-4.6.0,-smt2,-in,SMTLIB2_COMPLIANT=true"
          echo "org.smtlib.solver_z3_4_8.adapter=org.smtlib.solvers.Solver_z3_4_8"
          echo "org.smtlib.solver_z3_4_8.exec=$SOLVERS/z3-4.8.12"
          echo "org.smtlib.solver_z3_4_8.command=$SOLVERS/z3-4.8.12,-smt2,-in,SMTLIB2_COMPLIANT=true"
          echo "org.smtlib.solver_cvc4.exec=$SOLVERS/cvc4-1.6"
          echo "org.smtlib.solver_simplify.exec="
        } > jSMTLIB/SMTTests/jsmtlib.properties

    - name: Run jSMTLIB tests
      shell: bash
      run: |
        make -C jSMTLIB/SMTTests test
