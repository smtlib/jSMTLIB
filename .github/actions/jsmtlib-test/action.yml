name: 'jSMTLIB Test'
description: 'A composite action that runs the jSMTLIB test suite on an existing build'

## Presumes jSMTLIB/ exists in the current working directory (from jsmtlib-checkout),
## and that jSMTLIB/SMT/jSMTLIB.jar has been placed there (by the test job).
##
## Clones the Solvers repo, selects the platform-appropriate subdirectory, and exports
## SMT_SOLVER_DIR so that the Java resolver prepends it to relative executable names
## from SMT/jsmtlib.properties.  No generated jsmtlib.properties file is written.

inputs:
  solvers:
    description: 'Override SMT_TEST_SOLVERS (space-separated). Blank = the Makefile default (full solver list).'
    required: false
    default: ''
  label:
    description: 'Human-readable identifier for this platform leg (e.g. "macos-arm64"), used to keep failure-artifact names unique across the test matrix. Falls back to runner.os-runner.arch if blank.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Clone Solvers repo
      shell: bash
      run: git clone -b master --depth 1 https://github.com/OpenJML/Solvers

    - name: Configure solver paths for CI
      shell: bash
      run: |
        ## Select the Solvers subdirectory matching this runner's OS and architecture.
        case "${{ runner.os }}-${{ runner.arch }}" in
          macOS-ARM64)  SOLVERS_SUBDIR=Solvers-macos-arm64 ;;
          macOS-X64)    SOLVERS_SUBDIR=Solvers-macos ;;
          Linux-ARM64)  SOLVERS_SUBDIR=Solvers-linux-arm64 ;;
          Linux-X64)    SOLVERS_SUBDIR=Solvers-linux ;;
          Windows-X64)  SOLVERS_SUBDIR=Solvers-windows ;;
          *) echo "ERROR: unsupported runner OS/arch: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac

        SOLVER_DIR="$GITHUB_WORKSPACE/Solvers/$SOLVERS_SUBDIR"
        ## Normalize to forward slashes so Java path handling works on Windows.
        SOLVER_DIR="${SOLVER_DIR//\\/\/}"

        ## Make every solver binary executable (no-op on Windows). Blanket glob rather
        ## than a per-solver-name list, which would need updating each time a solver
        ## is added; harmless here since these dirs hold nothing but solver binaries.
        if [[ "${{ runner.os }}" != "Windows" ]]; then
          chmod +x "$SOLVER_DIR"/* 2>/dev/null || true
        fi

        ## Windows ships z3-4.3.2.exe; jsmtlib.properties references z3-4.3.1.
        ## Create z3-4.3.1.exe alongside it so the relative name resolves correctly.
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          if [[ -f "$SOLVER_DIR/z3-4.3.2.exe" && ! -f "$SOLVER_DIR/z3-4.3.1.exe" ]]; then
            cp "$SOLVER_DIR/z3-4.3.2.exe" "$SOLVER_DIR/z3-4.3.1.exe"
          fi
        fi

        ## Export SMT_SOLVER_DIR so the Java resolver prepends it to relative exec names
        ## from jsmtlib.properties (e.g. z3-4.3.1 → $SMT_SOLVER_DIR/z3-4.3.1).
        echo "SMT_SOLVER_DIR=$SOLVER_DIR" >> "$GITHUB_ENV"

    ## Not wired into jsmtlib.properties yet (cvc5/z3 adapter work is happening
    ## separately, yices2/bitwuzla/alt-ergo/smtinterpol after that) — this just confirms
    ## every solver binary present for this platform actually executes on this runner
    ## (e.g. that macOS's freshly-built libcudd and brew-installed gmp/mpfr resolve),
    ## before sinking time into the full test suite below. Iterates every file in
    ## SMT_SOLVER_DIR rather than a per-solver-name list, which would go stale as
    ## solvers are added; Solvers-windows is the one directory with non-solver files
    ## (Z3's .dll/.lib/.xml JNI bindings and runtime redistributables) alongside the
    ## .exe's, so those extensions are skipped. A solver failing to run here is a
    ## warning, not a build failure — this step always exits 0.
    - name: Smoke test solver binaries
      shell: bash
      run: |
        ## GitHub Actions runs bash steps with `set -e` by default. A bare
        ## `out=$(cmd)` assignment (not inside if/&&/||) trips errexit the moment
        ## any solver's --version exits nonzero, aborting this whole step *and*
        ## skipping "Run jSMTLIB tests" (composite actions stop at the first
        ## failing sub-step) - silently skipping the real suite entirely. `set +e`
        ## makes that structurally impossible regardless of exact command syntax.
        set +e
        echo "Solver smoke test on ${{ runner.os }}-${{ runner.arch }}"
        for exe in "$SMT_SOLVER_DIR"/*; do
          [ -f "$exe" ] || continue
          name=$(basename "$exe")
          case "$name" in
            *.dll|*.lib|*.xml) continue ;;
            *.jar)
              out=$(java -jar "$exe" -version 2>&1); ok=$?
              ;;
            *)
              out=$("$exe" --version 2>&1); ok=$?
              ## Some older solvers (e.g. z3 4.3.x) predate the --version convention.
              if [ $ok -ne 0 ]; then
                out=$("$exe" -version 2>&1); ok=$?
              fi
              ;;
          esac
          if [ $ok -eq 0 ]; then
            echo "OK   $name: $(echo "$out" | head -1)"
          else
            echo "FAIL $name:"
            echo "$out" | sed 's/^/       /'
          fi
        done
        exit 0

    ## Only set SMT_TEST_SOLVERS when an override was actually given -- the Makefile's
    ## `?=` default only kicks in when the variable is entirely unset in the environment,
    ## so exporting it as an empty string here (e.g. from an un-filled workflow_dispatch
    ## input) would leave the suite running against no solvers at all instead of falling
    ## back to the default list.
    - name: Apply solver-list override
      if: inputs.solvers != ''
      shell: bash
      run: echo "SMT_TEST_SOLVERS=${{ inputs.solvers }}" >> "$GITHUB_ENV"

    - name: Run jSMTLIB tests
      shell: bash
      run: |
        make -C jSMTLIB/SMTTests tests

    ## Captures exactly what's needed to debug a failure after the fact, without needing
    ## to reproduce it locally: the .actual files FileTests.java writes next to a golden
    ## on mismatch (the same expected-vs-actual diff seen in the console log, but as a
    ## standalone file you can pull down and inspect/diff directly) and the timestamped
    ## junit-logs/*.log that records every test's PASS/FAIL/RUNNING as it happened, for
    ## correlating ordering and timing across a run. if-no-files-found is set to 'warn'
    ## (not 'error') since a failure can also come from something before any test ran
    ## (e.g. a compile error), in which case there may be nothing to collect here.
    - name: Upload test failure artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-failure-${{ inputs.label != '' && inputs.label || format('{0}-{1}', runner.os, runner.arch) }}
        path: |
          jSMTLIB/SMTTests/tests/**/*.actual
          jSMTLIB/SMTTests/junit-logs/
        if-no-files-found: warn
        retention-days: 14
